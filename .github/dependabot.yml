# Dependabot, com espera antes de adotar versão nova.
#
# Os ataques ao npm de 2025 (chalk/debug e o Shai-Hulud) viveram poucas horas
# ou dias no ar antes de serem retirados. Quem instalava a versão do dia levava
# junto o script que rouba credencial da máquina de build. A espera (`cooldown`)
# deixa a versão nova envelhecer antes de virar PR aqui.
#
# Correção de segurança não espera: o GitHub abre esses PRs na hora, com ou sem
# cooldown. Para isso, "Dependabot security updates" precisa estar ligado em
# Settings > Code security.
version: 2
updates:
  - package-ecosystem: npm
    directory: /
    schedule:
      interval: weekly
    cooldown:
      default-days: 7
      semver-major-days: 30
    open-pull-requests-limit: 5
    groups:
      menores:
        update-types: [minor, patch]
    # Majors que quebram o lint hoje. Cada linha diz o que precisa mudar para
    # sair daqui; sem ela, o PR reabre toda semana e ninguém lembra por quê.
    ignore:
      # typescript-eslint ainda não suporta TS 7 ("does not support TS 7.0").
      - dependency-name: typescript
        update-types: [version-update:semver-major]
      # eslint-plugin-react (via eslint-config-next) quebra no ESLint 10:
      # "contextOrFilename.getFilename is not a function".
      - dependency-name: eslint
        update-types: [version-update:semver-major]
      - dependency-name: '@eslint/js'
        update-types: [version-update:semver-major]

  - package-ecosystem: github-actions
    directory: /
    schedule:
      interval: monthly
    cooldown:
      default-days: 7
